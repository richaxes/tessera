<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E6ECEA">
<title>Tessera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a tiled workshop table — market (displays + centre) beside your board; opponents as small boards above. */
:root{
  --bg:#E6ECEA; --surface:#F5F8F7; --well:#D3DDDA; --ink:#15262B; --muted:#5A6C6F; --line:#C3CFCC;
  --brass:#9C6F1C; --brass-soft:#E9D7AE; --ok:#2C7A57; --ok-soft:rgba(44,122,87,.16); --warn:#B2432C;
  --felt:#D9E3E0; --shadow:0 1px 0 rgba(21,38,43,.06),0 6px 18px -10px rgba(21,38,43,.35);
  --display:"Gloock",Georgia,"Times New Roman",serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D191C; --surface:#14252A; --well:#1D3237; --ink:#E3ECEA; --muted:#8EA3A4; --line:#29403F;
  --brass:#D9AA4F; --brass-soft:#3A3220; --ok:#5CC08F; --ok-soft:rgba(92,192,143,.18); --warn:#E57A5F;
  --felt:#182C31; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D191C; --surface:#14252A; --well:#1D3237; --ink:#E3ECEA; --muted:#8EA3A4; --line:#29403F;
  --brass:#D9AA4F; --brass-soft:#3A3220; --ok:#5CC08F; --ok-soft:rgba(92,192,143,.18); --warn:#E57A5F;
  --felt:#182C31; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.005em}
.label{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--brass)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{background:var(--brass);border-color:var(--brass);color:#fff}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 12px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 14px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
input[type=text]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-width:0;width:100%}
input[type=text]:focus{border-color:var(--brass);outline:none}

/* header */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:26px;line-height:1}
.mark .tile{width:22px;height:22px}
.top .grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip.go{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.code{font-family:ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.14em}

/* home */
.hero{display:grid;gap:14px;padding-block:6px 4px}
.hero h1{font-size:clamp(40px,8vw,72px);line-height:.95}
.hero p{max-width:56ch;margin:0;color:var(--muted);font-size:16px}
.hero-tiles{display:flex;gap:10px;flex-wrap:wrap}
.hero-tiles figure{margin:0;display:grid;gap:6px;justify-items:center}
.hero-tiles .tile{width:clamp(48px,13vw,76px);height:clamp(48px,13vw,76px);filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.hero-tiles figcaption{font-size:12px;color:var(--muted)}
.cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;min-width:0}
.panel h2{font-size:24px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>input{flex:1 1 140px}
.list{display:grid;gap:8px}
.tablecard{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);flex-wrap:wrap}
.tablecard .who{flex:1;min-width:0;font-size:14px}
.tablecard .who b{font-weight:600}
.empty{padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px}
.seatrow{display:flex;gap:8px;align-items:center}
.seatrow input{flex:1}
details{border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600}
.rules{color:var(--muted);font-size:14px;max-width:70ch}
.rules li{margin-block:4px}

/* tiles */
.tile{display:block;width:var(--t);height:var(--t)}
.tile.ghost{opacity:.2;filter:saturate(.6)}
.tok{width:var(--t);height:var(--t);border-radius:18%;background:#F3E4C8;color:#15262B;display:grid;place-items:center;font-family:var(--display);font-size:calc(var(--t)*.6);box-shadow:inset 0 0 0 1.5px rgba(21,38,43,.35)}
.tilebtn{border:0;padding:0;background:none;border-radius:20%;transition:transform .12s}
.tilebtn:hover:not(:disabled){transform:translateY(-2px)}
.tilebtn.sel{outline:3px solid var(--brass);outline-offset:1px;transform:translateY(-3px)}
.tilebtn:disabled{cursor:default}

/* game */
.game{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){.game{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}.mine{grid-column:2;grid-row:1/span 3}}
.status{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-height:38px;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.status.mine-turn{border-color:var(--ok);background:var(--ok-soft)}
.status .grow{flex:1;min-width:0}
.opps{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}
.market{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:14px;--t:clamp(26px,7.2vw,38px)}
.facs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.fac{width:calc(var(--t)*2 + 34px);height:calc(var(--t)*2 + 34px);border-radius:50%;background:var(--felt);display:grid;place-items:center;position:relative;box-shadow:inset 0 2px 6px rgba(0,0,0,.12)}
.fac .g{display:grid;grid-template-columns:repeat(2,var(--t));gap:5px}
.fac .n{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);font-weight:600}
.fac.recent{box-shadow:inset 0 2px 6px rgba(0,0,0,.12),0 0 0 2px var(--brass-soft)}
.centre{border-radius:14px;background:var(--felt);padding:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:calc(var(--t) + 24px);box-shadow:inset 0 2px 6px rgba(0,0,0,.1)}
.centre .lab{width:100%;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.grp{display:flex;gap:3px;padding:3px;border-radius:10px}

.board{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:12px;--t:clamp(24px,7.2vw,40px);--g:clamp(3px,.8vw,5px);box-shadow:var(--shadow);min-width:0}
.board.compact{--t:clamp(12px,3.4vw,16px);--g:2px;padding:10px;gap:7px;flex:0 0 auto;box-shadow:none}
.board.turn{border-color:var(--ok)}
.bhead{display:flex;align-items:baseline;gap:8px}
.bhead .nm{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board.compact .bhead .nm{font-size:13px}
.bhead .sc{font-family:var(--display);font-size:28px;line-height:1}
.board.compact .bhead .sc{font-size:18px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:0 0 auto;align-self:center}
.bgrid{display:grid;grid-template-columns:auto auto;gap:calc(var(--g)*3);justify-content:center}
.lines,.wall{display:grid;gap:var(--g)}
.line{display:flex;justify-content:flex-end;gap:var(--g);border-radius:8px;padding:0;border:0;background:none;transition:background .12s}
.line.ok{background:var(--ok-soft);box-shadow:0 0 0 2px var(--ok);cursor:pointer}
.line:disabled{cursor:default}
.slot{width:var(--t);height:var(--t);border-radius:18%;background:var(--well)}
.wall{grid-template-columns:repeat(5,var(--t))}
.cell{width:var(--t);height:var(--t);position:relative}
.cell.fresh .tile{animation:drop .5s ease-out}
.floor{display:flex;gap:var(--g);align-items:flex-start;justify-content:center;border:0;background:none;padding:4px;border-radius:10px}
.floor.ok{background:var(--ok-soft);box-shadow:0 0 0 2px var(--ok);cursor:pointer}
.floor:disabled{cursor:default}
.fs{display:grid;gap:2px;justify-items:center}
.fs i{font-style:normal;font-size:10px;color:var(--muted)}
.board.compact .fs i{display:none}
@keyframes drop{from{transform:scale(1.35);opacity:0}to{transform:none;opacity:1}}

/* lobby */
.waiting{display:grid;gap:14px;justify-items:start}
.bigcode{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:clamp(32px,9vw,52px);letter-spacing:.2em;color:var(--brass)}
.seats{display:grid;gap:8px;width:100%}
.seat{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.seat .grow{flex:1;min-width:0}
.seat.open{border-style:dashed;color:var(--muted)}

/* overlays */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.banner{position:fixed;inset:auto 0 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center;z-index:25;pointer-events:none}
.banner .card{pointer-events:auto;background:var(--surface);border:1px solid var(--brass);border-radius:16px;padding:14px 18px;box-shadow:var(--shadow);display:grid;gap:8px;max-width:480px;width:100%}
.banner table,.final table{width:100%;border-collapse:collapse;font-size:14px}
.banner td,.final td,.final th{padding:4px 6px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.final th{text-align:left;font-weight:600;color:var(--muted);font-size:12px}
.final td:not(:first-child),.final th:not(:first-child),.banner td:not(:first-child){text-align:right}
.final{background:var(--surface);border:2px solid var(--brass);border-radius:18px;padding:18px;display:grid;gap:14px}
.final h2{font-size:30px}
.win{color:var(--brass);font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
</head>

<script>
// ---------- Tessera rules engine (pure, JSON state) ----------
const Engine = (() => {
  const COLORS = 5, PER_COLOR = 20, FLOOR = [1, 1, 2, 2, 2, 3, 3];
  const FACTORIES = { 2: 5, 3: 7, 4: 9 };
  const wallCol = (row, color) => (color + row) % 5;
  const wallColor = (row, col) => (col - row + 5) % 5;
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const sum = (a) => a.reduce((x, y) => x + y, 0);

  function emptyPlayer() {
    return {
      score: 0,
      lines: Array.from({ length: 5 }, () => ({ color: -1, n: 0 })),
      wall: Array.from({ length: 5 }, () => [false, false, false, false, false]),
      floor: [],
    };
  }

  function drawOne(s, rng) {
    if (sum(s.bag) === 0) {
      for (let c = 0; c < COLORS; c++) { s.bag[c] += s.lid[c]; s.lid[c] = 0; }
    }
    const total = sum(s.bag);
    if (total === 0) return -1;
    let r = Math.floor(rng() * total);
    for (let c = 0; c < COLORS; c++) {
      if (r < s.bag[c]) { s.bag[c]--; return c; }
      r -= s.bag[c];
    }
    return -1;
  }

  function fillFactories(s, rng) {
    s.factories = s.factories.map(() => {
      const f = [];
      for (let i = 0; i < 4; i++) { const c = drawOne(s, rng); if (c >= 0) f.push(c); }
      return f.sort((a, b) => a - b);
    });
    s.center = [];
    s.centerToken = true;
  }

  function newGame(n, rng = Math.random, first = 0) {
    const s = {
      bag: Array(COLORS).fill(PER_COLOR), lid: Array(COLORS).fill(0),
      factories: Array.from({ length: FACTORIES[n] }, () => []),
      center: [], centerToken: true,
      players: Array.from({ length: n }, emptyPlayer),
      turn: first, firstNext: null, round: 1, seq: 0,
      status: 'playing', lastMove: null, lastRound: null, final: null, log: [],
    };
    fillFactories(s, rng);
    return s;
  }

  function canPlace(p, line, color) {
    if (line < 0) return true; // floor
    const L = p.lines[line];
    if (p.wall[line][wallCol(line, color)]) return false;
    if (L.color !== -1 && L.color !== color) return false;
    if (L.n >= line + 1) return false;
    return true;
  }

  function sources(s) {
    const out = [];
    s.factories.forEach((f, i) => {
      [...new Set(f)].forEach((c) => out.push({ src: i, color: c, count: f.filter((x) => x === c).length }));
    });
    [...new Set(s.center)].forEach((c) => out.push({ src: 'c', color: c, count: s.center.filter((x) => x === c).length }));
    return out;
  }

  function legalMoves(s) {
    if (s.status !== 'playing') return [];
    const p = s.players[s.turn], out = [];
    for (const so of sources(s)) {
      for (let line = -1; line < 5; line++) if (canPlace(p, line, so.color)) out.push({ src: so.src, color: so.color, line, count: so.count });
    }
    return out;
  }

  function addToFloor(s, p, tiles) {
    for (const t of tiles) {
      if (p.floor.length < 7) p.floor.push(t);
      else if (t >= 0) s.lid[t]++;
    }
  }

  function placementScore(wall, r, c) {
    let h = 1, v = 1;
    for (let x = c - 1; x >= 0 && wall[r][x]; x--) h++;
    for (let x = c + 1; x < 5 && wall[r][x]; x++) h++;
    for (let y = r - 1; y >= 0 && wall[y][c]; y--) v++;
    for (let y = r + 1; y < 5 && wall[y][c]; y++) v++;
    if (h === 1 && v === 1) return 1;
    return (h > 1 ? h : 0) + (v > 1 ? v : 0);
  }

  function floorPenalty(n) { return sum(FLOOR.slice(0, Math.min(n, 7))); }

  function bonuses(p) {
    let rows = 0, cols = 0, colors = 0;
    for (let r = 0; r < 5; r++) if (p.wall[r].every(Boolean)) rows++;
    for (let c = 0; c < 5; c++) if (p.wall.every((row) => row[c])) cols++;
    for (let k = 0; k < 5; k++) { let all = true; for (let r = 0; r < 5; r++) if (!p.wall[r][wallCol(r, k)]) all = false; if (all) colors++; }
    return { rows, cols, colors, points: rows * 2 + cols * 7 + colors * 10 };
  }

  function roundOver(s) { return s.factories.every((f) => f.length === 0) && s.center.length === 0; }

  function scoreRound(s, rng) {
    const summary = s.players.map((p) => {
      const before = p.score, placed = [];
      for (let r = 0; r < 5; r++) {
        const L = p.lines[r];
        if (L.n === r + 1) {
          const c = wallCol(r, L.color);
          p.wall[r][c] = true;
          const pts = placementScore(p.wall, r, c);
          p.score += pts;
          placed.push({ r, c, pts });
          s.lid[L.color] += r; // remaining tiles to the lid
          p.lines[r] = { color: -1, n: 0 };
        }
      }
      const pen = floorPenalty(p.floor.length);
      p.score = Math.max(0, p.score - pen);
      for (const t of p.floor) if (t >= 0) s.lid[t]++;
      p.floor = [];
      return { gain: p.score - before, placed, penalty: pen };
    });
    s.lastRound = { round: s.round, summary };
    const ended = s.players.some((p) => p.wall.some((row) => row.every(Boolean)));
    if (ended) {
      s.final = s.players.map((p) => { const b = bonuses(p); p.score += b.points; return b; });
      s.status = 'over';
      const best = Math.max(...s.players.map((p) => p.score));
      const tied = s.players.map((p, i) => i).filter((i) => s.players[i].score === best);
      const maxRows = Math.max(...tied.map((i) => s.final[i].rows));
      s.winners = tied.filter((i) => s.final[i].rows === maxRows);
    } else {
      s.round++;
      s.turn = s.firstNext ?? s.turn;
      s.firstNext = null;
      fillFactories(s, rng);
    }
  }

  function applyMove(state, move, rng = Math.random) {
    const s = clone(state);
    if (s.status !== 'playing') throw new Error('Game is not in progress');
    const p = s.players[s.turn];
    const { src, color, line } = move;
    let taken;
    let tookToken = false;
    if (src === 'c') {
      taken = s.center.filter((c) => c === color);
      if (!taken.length) throw new Error('That colour is not in the centre');
      s.center = s.center.filter((c) => c !== color);
      if (s.centerToken) { s.centerToken = false; tookToken = true; s.firstNext = s.turn; }
    } else {
      const f = s.factories[src];
      if (!f) throw new Error('No such display');
      taken = f.filter((c) => c === color);
      if (!taken.length) throw new Error('That colour is not on this display');
      s.center.push(...f.filter((c) => c !== color));
      s.center.sort((a, b) => a - b);
      s.factories[src] = [];
    }
    if (!canPlace(p, line, color)) throw new Error('That tile cannot go on this row');
    if (tookToken) addToFloor(s, p, [-1]);
    let toFloor = taken.length;
    if (line >= 0) {
      const L = p.lines[line];
      const room = line + 1 - L.n;
      const put = Math.min(room, taken.length);
      L.color = color; L.n += put; toFloor = taken.length - put;
    }
    addToFloor(s, p, Array(toFloor).fill(color));
    s.lastMove = { player: s.turn, src, color, count: taken.length, line, tookToken, toFloor };
    s.seq++;
    s.lastRound = null;
    if (roundOver(s)) scoreRound(s, rng);
    else s.turn = (s.turn + 1) % s.players.length;
    return s;
  }

  // Greedy bot: values completing rows by their wall score, punishes floor overflow.
  function botMove(s, rng = Math.random) {
    const moves = legalMoves(s), p = s.players[s.turn];
    const tilesLeft = sum(s.factories.map((f) => f.length)) + s.center.length;
    let best = null, bestV = -Infinity;
    for (const m of moves) {
      let v = 0, toFloor = m.count;
      const tokenCost = m.src === 'c' && s.centerToken ? 1 : 0;
      if (m.line >= 0) {
        const L = p.lines[m.line], cap = m.line + 1, room = cap - L.n;
        const put = Math.min(room, m.count);
        toFloor = m.count - put;
        const filled = L.n + put;
        if (filled === cap) {
          const w = p.wall.map((r) => r.slice());
          const c = wallCol(m.line, m.color);
          w[m.line][c] = true;
          v += placementScore(w, m.line, c) + 1.5;
          v += 0.4 * (4 - m.line); // finishing top rows early is cheap
        } else {
          v += (filled / cap) * 1.6 - (cap - filled) * (tilesLeft < 12 ? 0.6 : 0.15);
          if (L.n === 0) v -= 0.2 * m.line;
        }
      }
      const fl = p.floor.length;
      v -= floorPenalty(fl + toFloor + tokenCost) - floorPenalty(fl);
      if (tokenCost) v += 0.6;
      if (m.line < 0) v -= 0.5;
      v += rng() * 0.3;
      if (v > bestV) { bestV = v; best = m; }
    }
    return best;
  }

  return { newGame, legalMoves, applyMove, canPlace, botMove, wallCol, wallColor, placementScore, bonuses, FLOOR, floorPenalty, sources };
})();


</script>
<script>
(() => {
const NAMES = ['Jackalope', 'Prince', 'Red panda', 'Cicavirág', 'Rose'];
const NAMES_PL = ['Jackalope', 'Prince', 'Red panda', 'Cicavirág', 'Rose'];
const app = document.getElementById('app'), overlay = document.getElementById('overlay');
const TAB = Math.random().toString(36).slice(2, 10);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const tileSvg = (c, cls = '') => c < 0 ? `<span class="tok" aria-label="First player marker">1</span>` : `<svg class="tile ${cls}" viewBox="0 0 100 100" role="img" aria-label="${NAMES[c]}"><use href="#tile${c}"/></svg>`;
const store = { get(k, d) { try { const v = localStorage.getItem('tessera.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('tessera.' + k, JSON.stringify(v)); } catch {} } };

// ---------- app state ----------
let db = null, user = null, myId = null, onlineReady = false, onlineChecked = false, onlineError = '';
let view = 'home';
let G = null;          // current game: {mode, code, doc, seats, state}
let sel = null;        // {src, color}
let lobby = [];        // table docs
let unsubGame = null;
let names = {};        // id -> profile name
let botTimer = null, bannerFor = null, bannerTimer = null, removeArmed = false;
let localSetup = store.get('local', { n: 2, seats: [{ nick: '', bot: false }, { nick: '', bot: false }, { nick: '', bot: true }, { nick: '', bot: true }] });
let onlineSize = 2, onlinePrivate = true;
let nick = store.get('nick', '');
let toastTimer = null;

function toast(msg) {
  clearTimeout(toastTimer);
  overlay.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; overlay.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), 3200);
}

// ---------- names ----------
function seatName(i) {
  const s = G?.seats?.[i];
  if (!s) return `Player ${i + 1}`;
  if (s.bot) return 'Computer' + (G.seats.filter((x) => x.bot).length > 1 ? ' ' + (G.seats.slice(0, i + 1).filter((x) => x.bot).length) : '');
  return s.nick || (s.id && names[s.id]) || `Player ${i + 1}`;
}
function isMe(i) { return G?.mode === 'online' && G.seats[i] && !G.seats[i].bot && G.seats[i].id === myId; }
function refreshNames(ids) {
  if (!user) return;
  ids = [...new Set(ids.filter(Boolean))];
  if (!ids.length) return;
  user.profiles(ids).then((ps) => {
    let changed = false;
    for (const id of ids) { const n = ps[id]?.name || ''; if (names[id] !== n) { names[id] = n; changed = true; } }
    if (changed) render();
  });
}

// ---------- seats / turn helpers ----------
function mySeat() { return G?.mode === 'online' ? G.seats.findIndex((s) => !s.bot && s.id === myId) : -1; }
function canAct() {
  if (!G?.state || G.state.status !== 'playing') return false;
  const t = G.state.turn, s = G.seats[t];
  if (!s || s.bot) return false;
  return G.mode === 'local' ? true : t === mySeat();
}
function focusSeat() {
  if (!G?.state) return 0;
  if (G.mode === 'online') { const m = mySeat(); return m >= 0 ? m : G.state.turn; }
  const t = G.state.turn;
  if (!G.seats[t].bot) { G.lastHuman = t; return t; }
  return G.lastHuman ?? G.seats.findIndex((s) => !s.bot) ?? 0;
}

// ---------- rendering ----------
function render() {
  document.title = (G?.mode === 'online' && canAct()) ? '● Your turn · Tessera' : 'Tessera';
  if (view === 'home') app.innerHTML = homeHTML();
  else app.innerHTML = gameHTML();
  renderOverlays();
}

function header(extra = '') {
  return `<header class="top"><div class="mark">${tileSvg(2)}<span>Tessera</span></div><div class="grow"></div>${extra}</header>`;
}

function homeHTML() {
  const mineTables = lobby.filter((d) => (d.playerIds || []).includes(myId));
  const open = lobby.filter((d) => d.status === 'lobby' && !d.private && !(d.playerIds || []).includes(myId) && d.seats.length < d.size);
  const tcard = (d) => {
    const ppl = d.seats.map((s) => s.bot ? 'Computer' : (s.nick || names[s.id] || 'Player')).join(' · ');
    const st = d.status === 'lobby' ? `Waiting · ${d.seats.length}/${d.size}` : d.status === 'over' ? 'Finished' : (d.state && d.seats[d.state.turn]?.id === myId && !d.seats[d.state.turn]?.bot ? '<span class="chip go">Your turn</span>' : `Round ${d.state?.round ?? 1}`);
    const joined = (d.playerIds || []).includes(myId);
    return `<div class="tablecard"><span class="chip code">${esc(d.code)}</span><div class="who"><b>${esc(ppl)}</b><div class="muted" style="font-size:12.5px">${st}</div></div><button class="btn sm ${joined ? 'primary' : ''}" data-act="${joined ? 'open' : 'join'}" data-code="${esc(d.code)}">${joined ? 'Open' : 'Join'}</button></div>`;
  };
  let online;
  if (!onlineChecked) online = `<div class="empty">Connecting…</div>`;
  else if (!onlineReady) online = `<div class="empty">${esc(onlineError || 'Online play isn’t connected yet.')} You can still play on this device.</div>`;
  else online = `
    <div class="row"><span class="label">Players</span>${seg('osize', [2, 3, 4], onlineSize)}
      <label class="row muted" style="gap:6px;font-size:14px"><input type="checkbox" id="opriv" ${onlinePrivate ? 'checked' : ''}> Invite only</label></div>
    <div class="row"><button class="btn primary" data-act="create">New table</button><span class="muted" style="font-size:13px">You'll get a code to send to the people you want to play with.</span></div>
    <div class="row"><input type="text" id="joincode" placeholder="Table code, e.g. KQ4TR" maxlength="6" autocomplete="off" style="text-transform:uppercase"><button class="btn" data-act="joincode">Join</button></div>
    <div class="list"><span class="label">Your tables</span>${mineTables.length ? mineTables.map(tcard).join('') : '<div class="empty">No tables yet. Start one and share its code.</div>'}</div>
    ${open.length ? `<div class="list"><span class="label">Open tables</span>${open.map(tcard).join('')}</div>` : ''}`;
  const L = localSetup;
  const seatsHTML = Array.from({ length: L.n }, (_, i) => `<div class="seatrow"><input type="text" id="lseat${i}" placeholder="Player ${i + 1}" value="${esc(L.seats[i].nick)}" maxlength="18" data-seat="${i}">${seg('lbot' + i, ['Person', 'Computer'], L.seats[i].bot ? 'Computer' : 'Person')}</div>`).join('');
  return header() + `
  <section class="hero">
    <h1>Draft tiles,<br>build your wall.</h1>
    <p>A tile-drafting game for two to four players, with a hand-made set of five glazed tiles. Play a friend online one-on-one, or pass one device around the table.</p>
    <div class="hero-tiles">${[0, 1, 2, 3, 4].map((c) => `<figure>${tileSvg(c)}<figcaption>${NAMES[c]}</figcaption></figure>`).join('')}</div>
  </section>
  <div class="cols">
    <section class="panel"><h2>Play online</h2>
      <div class="row"><span class="label">Your name</span><input type="text" id="nick" value="${esc(nick)}" placeholder="Shown to other players" maxlength="18"></div>
      ${online}
    </section>
    <section class="panel"><h2>Play on this device</h2>
      <div class="row"><span class="label">Players</span>${seg('lsize', [2, 3, 4], L.n)}</div>
      <div class="list">${seatsHTML}</div>
      <div class="row"><button class="btn primary" data-act="local">Start game</button></div>
    </section>
  </div>
  <details><summary>How to play</summary><ol class="rules">
    <li>On your turn, take <b>all tiles of one design</b> from a display (the rest slide to the centre) or all of one design from the centre. The first player to take from the centre also takes the <b>1</b> marker, which goes on their floor and makes them start next round.</li>
    <li>Put the tiles on one of your five rows. A row holds one design only, and not one you already have on that row of your wall. Extra tiles fall to the floor.</li>
    <li>When the market is empty, each full row moves one tile across to the wall. It scores 1, or 1 for every tile in the connected line it joins, across and down. Floor tiles cost −1, −1, −2, −2, −2, −3, −3.</li>
    <li>The game ends after the round in which someone completes a horizontal wall row. Bonuses: +2 per full row, +7 per full column, +10 for all five of one design. Most points wins; ties go to most full rows.</li>
  </ol></details>`;
}

function seg(id, opts, cur) {
  return `<div class="seg" role="group">${opts.map((o) => `<button type="button" data-seg="${id}" data-val="${o}" aria-pressed="${String(o) === String(cur)}">${o}</button>`).join('')}</div>`;
}

function gameHTML() {
  const top = (extra) => header(extra);
  const back = `<button class="btn sm" data-act="home">← ${G.mode === 'online' ? 'Tables' : 'Menu'}</button>`;
  if (G.mode === 'online' && (!G.doc)) return top(back) + `<div class="empty">Loading table…</div>`;
  if (G.mode === 'online' && G.doc.status === 'lobby') return top(back) + lobbyHTML();
  const s = G.state;
  const codeChip = G.mode === 'online' ? `<button class="chip code" data-act="copy" title="Copy table code">${esc(G.code)}</button>` : '';
  const head = top(`<span class="chip num">Round ${s.round}</span>${codeChip}${back}`);
  const f = focusSeat();
  const others = s.players.map((_, i) => i).filter((i) => i !== f);
  return head + `
  ${statusHTML()}
  <div class="game">
    ${others.length ? `<div class="opps">${others.map((i) => boardHTML(i, true)).join('')}</div>` : ''}
    ${marketHTML()}
    <div class="mine">${boardHTML(f, false)}</div>
    ${s.status === 'over' ? finalHTML() : ''}
  </div>`;
}

function describeMove(m) {
  if (!m) return '';
  const from = m.src === 'c' ? 'the centre' : `display ${m.src + 1}`;
  const to = m.line < 0 ? 'the floor' : `row ${m.line + 1}`;
  return `${esc(seatName(m.player))} took ${m.count} ${NAMES[m.color]} from ${from} → ${to}${m.toFloor && m.line >= 0 ? ` (${m.toFloor} to floor)` : ''}${m.tookToken ? ', plus the 1 marker' : ''}.`;
}

function statusHTML() {
  const s = G.state;
  if (s.status === 'over') return `<div class="status"><b>Game over.</b><span class="grow"></span></div>`;
  const t = s.turn, me = canAct();
  let msg;
  if (me && sel) msg = `<b>Place ${countSel()} ${NAMES[sel.color]}:</b> tap a highlighted row, or the floor. <button class="btn sm" data-act="cancel">Cancel</button>`;
  else if (me) msg = `<b>${G.mode === 'local' ? esc(seatName(t)) + ', your' : 'Your'} turn.</b> Tap a tile in a display or the centre.`;
  else if (G.seats[t]?.bot) msg = `${esc(seatName(t))} is thinking…`;
  else msg = `Waiting for <b>${esc(seatName(t))}</b>.`;
  const last = s.lastMove ? `<span class="muted" style="font-size:13px;width:100%">${describeMove(s.lastMove)}</span>` : '';
  return `<div class="status ${me ? 'mine-turn' : ''}"><span class="grow">${msg}</span>${last}</div>`;
}

function countSel() {
  if (!sel) return 0;
  const arr = sel.src === 'c' ? G.state.center : G.state.factories[sel.src];
  return arr.filter((c) => c === sel.color).length;
}

function marketHTML() {
  const s = G.state, act = canAct();
  const lm = s.lastMove;
  const btn = (src, c) => {
    const isSel = sel && sel.src === src && sel.color === c;
    return `<button class="tilebtn ${isSel ? 'sel' : ''}" data-act="pick" data-src="${src}" data-color="${c}" ${act ? '' : 'disabled'} aria-label="Take ${NAMES[c]} from ${src === 'c' ? 'centre' : 'display ' + (src + 1)}">${tileSvg(c)}</button>`;
  };
  const facs = s.factories.map((f, i) => `<div class="fac ${lm && lm.src === i ? 'recent' : ''}"><span class="n">${i + 1}</span>${f.length ? `<div class="g">${f.map((c) => btn(i, c)).join('')}</div>` : ''}</div>`).join('');
  const groups = [0, 1, 2, 3, 4].map((c) => { const n = s.center.filter((x) => x === c).length; return n ? `<div class="grp">${Array(n).fill(0).map(() => btn('c', c)).join('')}</div>` : ''; }).join('');
  return `<section class="market" aria-label="Market"><div class="facs">${facs}</div>
    <div class="centre"><span class="lab">Centre</span>${s.centerToken ? tileSvg(-1) : ''}${groups}${!s.centerToken && !s.center.length ? '<span class="muted" style="font-size:13px">Empty</span>' : ''}</div></section>`;
}

function boardHTML(pi, compact) {
  const s = G.state, p = s.players[pi];
  const active = !compact && canAct() && s.turn === pi && sel;
  const fresh = s.lastRound ? (s.lastRound.summary[pi]?.placed || []) : [];
  const lines = p.lines.map((L, r) => {
    const ok = active && Engine.canPlace(p, r, sel.color);
    const slots = Array.from({ length: r + 1 }, (_, k) => {
      const filled = k >= r + 1 - L.n;
      return filled ? tileSvg(L.color) : `<span class="slot"></span>`;
    }).join('');
    return `<button class="line ${ok ? 'ok' : ''}" ${ok ? `data-act="place" data-line="${r}"` : 'disabled tabindex="-1"'} aria-label="Row ${r + 1}">${slots}</button>`;
  }).join('');
  const wall = p.wall.map((row, r) => row.map((on, c) => {
    const color = Engine.wallColor(r, c);
    const isFresh = fresh.some((x) => x.r === r && x.c === c);
    return `<div class="cell ${isFresh ? 'fresh' : ''}">${tileSvg(color, on ? '' : 'ghost')}</div>`;
  }).join('')).join('');
  const fl = Engine.FLOOR.map((pen, k) => `<span class="fs">${k < p.floor.length ? tileSvg(p.floor[k]) : '<span class="slot"></span>'}<i>−${pen}</i></span>`).join('');
  const turn = s.status === 'playing' && s.turn === pi;
  return `<section class="board ${compact ? 'compact' : ''} ${turn ? 'turn' : ''}" aria-label="${esc(seatName(pi))}'s board">
    <div class="bhead">${turn ? '<span class="dot" title="Their turn"></span>' : ''}<span class="nm">${esc(seatName(pi))}${isMe(pi) ? ' <span class="muted">(you)</span>' : ''}</span><span class="sc num">${p.score}</span></div>
    <div class="bgrid"><div class="lines">${lines}</div><div class="wall">${wall}</div></div>
    <button class="floor ${active ? 'ok' : ''}" ${active ? 'data-act="place" data-line="-1"' : 'disabled tabindex="-1"'} aria-label="Floor">${fl}</button>
  </section>`;
}

function finalHTML() {
  const s = G.state;
  const order = s.players.map((_, i) => i).sort((a, b) => s.players[b].score - s.players[a].score);
  const w = s.winners.map((i) => seatName(i));
  const title = w.length > 1 ? `Shared win: ${w.map(esc).join(' & ')}` : `${esc(w[0])} wins`;
  const rows = order.map((i) => { const b = s.final[i]; return `<tr class="${s.winners.includes(i) ? 'win' : ''}"><td>${esc(seatName(i))}</td><td>${b.rows}</td><td>${b.cols}</td><td>${b.colors}</td><td>+${b.points}</td><td><b>${s.players[i].score}</b></td></tr>`; }).join('');
  const canRematch = G.mode === 'local' || (G.doc && G.doc.hostId === myId);
  return `<section class="final"><h2>${title}</h2>
    <div style="overflow-x:auto"><table><thead><tr><th>Player</th><th>Rows</th><th>Cols</th><th>Sets</th><th>Bonus</th><th>Total</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="row">${canRematch ? '<button class="btn primary" data-act="rematch">Rematch</button>' : '<span class="muted">The host can start a rematch.</span>'}<button class="btn" data-act="home">${G.mode === 'online' ? 'Back to tables' : 'Menu'}</button>
    ${G.mode === 'online' && G.doc?.hostId === myId ? `<button class="btn danger" data-act="remove">${removeArmed ? 'Tap again to remove' : 'Remove table'}</button>` : ''}</div></section>`;
}

function lobbyHTML() {
  const d = G.doc, host = d.hostId === myId, joined = (d.playerIds || []).includes(myId);
  const seats = Array.from({ length: d.size }, (_, i) => {
    const s = d.seats[i];
    if (!s) return `<div class="seat open"><span class="grow">Open seat</span></div>`;
    const kick = host && (s.bot || s.id !== myId) ? `<button class="btn sm" data-act="kick" data-seat="${i}">Remove</button>` : '';
    return `<div class="seat"><span class="grow"><b>${esc(seatName(i))}</b>${s.id === myId && !s.bot ? ' <span class="muted">(you)</span>' : ''}${d.hostId === s.id && !s.bot ? ' <span class="muted">· host</span>' : ''}</span>${kick}</div>`;
  }).join('');
  const full = d.seats.length >= d.size;
  return `<section class="panel waiting">
    <span class="label">Table code</span>
    <div class="row"><span class="bigcode">${esc(d.code)}</span><button class="btn sm" data-act="copy">Copy code</button></div>
    <p class="muted" style="margin:0;max-width:52ch">Send this code to the ${d.size === 2 ? 'person' : 'people'} you want to play with. They open this page, enter the code under <b>Play online</b>, and take a seat.</p>
    <div class="seats">${seats}</div>
    <div class="row">
      ${!joined && !full ? '<button class="btn primary" data-act="sit">Take a seat</button>' : ''}
      ${host ? `<button class="btn primary" data-act="start" ${full ? '' : 'disabled'}>Start game</button>${!full ? '<button class="btn" data-act="addbot">Add computer player</button>' : ''}` : (joined ? '<span class="muted">Waiting for the host to start.</span>' : '')}
      ${joined && !host ? '<button class="btn" data-act="leave">Leave table</button>' : ''}
      ${host ? `<button class="btn danger" data-act="remove">${removeArmed ? 'Tap again to remove' : 'Remove table'}</button>` : ''}
    </div></section>`;
}

function renderOverlays() {
  overlay.querySelector('.banner')?.remove();
  const s = G?.state;
  if (view !== 'game' || !s || !s.lastRound || s.status === 'over' || bannerFor !== s.lastRound.round + ':' + (G.code || 'local')) return;
  const rows = s.lastRound.summary.map((r, i) => `<tr><td>${esc(seatName(i))}</td><td>${r.placed.length} placed</td><td>${r.penalty ? '−' + r.penalty : '—'}</td><td><b>${r.gain >= 0 ? '+' : ''}${r.gain}</b></td></tr>`).join('');
  const b = document.createElement('div'); b.className = 'banner';
  b.innerHTML = `<div class="card"><div class="row"><b style="flex:1">Round ${s.lastRound.round} scored</b><button class="btn sm" data-act="closebanner">Close</button></div><table><tbody>${rows}</tbody></table></div>`;
  overlay.appendChild(b);
}

// ---------- state transitions ----------
function afterState(prevRound) {
  const s = G?.state;
  if (!s) return;
  if (s.lastRound && bannerFor !== s.lastRound.round + ':' + (G.code || 'local') && s.status !== 'over') {
    bannerFor = s.lastRound.round + ':' + (G.code || 'local');
    clearTimeout(bannerTimer); bannerTimer = setTimeout(() => { bannerFor = 'x'; renderOverlays(); }, 6500);
  }
  if (sel) { const ok = Engine.legalMoves(s).some((m) => m.src === sel.src && m.color === sel.color); if (!ok || !canAct()) sel = null; }
  scheduleBot();
}

function scheduleBot() {
  const s = G?.state;
  if (botTimer || !s || s.status !== 'playing' || !G.seats[s.turn]?.bot) return;
  if (G.mode === 'online' && mySeat() < 0) return;
  const seq = s.seq;
  botTimer = setTimeout(async () => {
    botTimer = null;
    if (!G?.state || G.state.seq !== seq) return scheduleBot();
    if (G.mode === 'local') {
      G.state = Engine.applyMove(G.state, Engine.botMove(G.state));
      afterState(); render();
    } else {
      await commit((d) => {
        if (!d.state || d.state.seq !== seq || d.status !== 'playing' || !d.seats[d.state.turn]?.bot) return null;
        d.state = Engine.applyMove(d.state, Engine.botMove(d.state));
        d.status = d.state.status === 'over' ? 'over' : 'playing';
        return d;
      }, true);
    }
  }, 900 + Math.random() * 500);
}

async function doMove(line) {
  if (!sel || !canAct()) return;
  const move = { src: sel.src, color: sel.color, line };
  if (!Engine.legalMoves(G.state).some((m) => m.src === move.src && m.color === move.color && m.line === line)) return;
  sel = null;
  const prev = G.state, next = Engine.applyMove(prev, move);
  G.state = next; afterState(); render();
  if (G.mode === 'online') {
    const me = mySeat();
    const ok = await commit((d) => {
      if (!d.state || d.state.seq !== prev.seq || d.state.turn !== me) return null;
      d.state = next; d.status = next.status === 'over' ? 'over' : 'playing';
      return d;
    });
    if (!ok) { toast('That move could not be saved. The board has been refreshed.'); }
  }
}

// ---------- online ----------
async function commit(mutate, quiet, code = G.code) {
  const ref = db.fs.doc('games/' + code);
  let last;
  for (let i = 0; i < 3; i++) {
    try {
      return await db.fs.runTransaction(async (tx) => {
        const snap = await tx.get(ref);
        if (!snap.exists) return false;
        const d = mutate(JSON.parse(JSON.stringify(snap.data())));
        if (!d) return false;
        d.updatedAt = Date.now();
        tx.set(ref, d);
        return true;
      });
    } catch (e) {
      last = e; console.warn('Save failed', e);
      if (e && e.code === 'permission-denied') break;
      await sleep(400 + Math.random() * 600);
    }
  }
  if (!quiet) {
    const c = (last && last.code) || '';
    toast(c === 'permission-denied' ? 'The database refused that change. Check the Firestore rules (step 4).'
      : c === 'unavailable' ? 'Can’t reach the database (unavailable). An ad blocker, antivirus or network filter may be blocking firestore.googleapis.com.'
      : c === 'failed-precondition' || c === 'not-found' ? 'The database isn’t set up correctly (' + c + '). Check that Firestore was created in Standard edition (step 3).'
      : 'Couldn’t save the move (' + (c || (last && last.message) || 'unknown') + ').');
  }
  return false;
}

function genCode() { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; return Array.from({ length: 5 }, () => A[Math.floor(Math.random() * A.length)]).join(''); }

async function createTable() {
  let code = genCode();
  try {
    for (let i = 0; i < 3 && (await db.doc('games/' + code).get()).exists; i++) code = genCode();
    const now = Date.now();
    await db.doc('games/' + code).set({ code, status: 'lobby', hostId: myId, size: onlineSize, private: onlinePrivate, seats: [{ id: myId, nick, bot: false }], playerIds: [myId], createdAt: now, updatedAt: now, state: null });
    openTable(code);
  } catch (e) {
    console.warn(e); toast(e?.code === 'permission-denied' ? 'The server refused to create the table. Check the Firestore rules (step 4).' : 'Couldn’t create the table (' + (e?.code || e?.message || 'unknown') + ').');
  }
}

function openTable(code) {
  code = code.toUpperCase();
  unsubGame?.(); clearTimeout(botTimer); botTimer = null; sel = null; removeArmed = false;
  G = { mode: 'online', code, doc: null, seats: [], state: null };
  view = 'game'; render();
  unsubGame = db.doc('games/' + code).onSnapshot((snap) => {
    if (!G || G.code !== code) return;
    if (!snap.exists) { if (!snap.metadata.fromCache) { toast(`Table ${code} doesn’t exist or was removed.`); goHome(); } return; }
    const d = JSON.parse(JSON.stringify(snap.data()));
    G.doc = d; G.seats = d.seats;
    if (!G.state || !d.state || d.state.seq >= G.state.seq || d.status !== 'playing') G.state = d.state;
    refreshNames(d.seats.map((s) => s.id));
    afterState(); render();
  }, () => { toast('Lost the connection to this table. Reopen it from Tables.'); });
}

async function sit(code) {
  const ok = await commit((d) => {
    if ((d.playerIds || []).includes(myId)) return d;
    if (d.status !== 'lobby' || d.seats.length >= d.size) return null;
    d.seats.push({ id: myId, nick, bot: false }); d.playerIds = [...(d.playerIds || []), myId];
    return d;
  }, false, code);
  return ok;
}

async function joinByCode(code) {
  code = (code || '').trim().toUpperCase();
  if (!/^[A-Z0-9]{5}$/.test(code)) return toast('Table codes are 5 letters and numbers.');
  try {
    const snap = await db.doc('games/' + code).get();
    if (!snap.exists) return toast(`No table with code ${code}.`);
    const d = snap.data();
    if ((d.playerIds || []).includes(myId)) return openTable(code);
    if (d.status !== 'lobby') { toast('That game has already started. Opening it to watch.'); return openTable(code); }
    if (d.seats.length >= d.size) { toast('That table is full. Opening it to watch.'); return openTable(code); }
    if (await sit(code)) openTable(code);
  } catch { toast('Couldn’t reach that table. Try again.'); }
}

function startOnline() {
  return commit((d) => {
    if (d.status !== 'lobby' || d.seats.length !== d.size || d.hostId !== myId) return null;
    d.state = Engine.newGame(d.size, Math.random, Math.floor(Math.random() * d.size));
    d.status = 'playing'; return d;
  });
}

// ---------- local ----------
function startLocal() {
  const n = localSetup.n;
  const seats = localSetup.seats.slice(0, n).map((s) => ({ nick: s.nick.trim(), bot: s.bot }));
  if (seats.every((s) => s.bot)) seats[0].bot = false;
  unsubGame?.(); unsubGame = null;
  G = { mode: 'local', seats, state: Engine.newGame(n, Math.random, Math.floor(Math.random() * n)) };
  view = 'game'; sel = null; bannerFor = null; afterState(); render();
}

function goHome() { unsubGame?.(); unsubGame = null; clearTimeout(botTimer); botTimer = null; view = 'home'; G = null; sel = null; removeArmed = false; render(); }

// ---------- events ----------
app.addEventListener('click', async (e) => {
  const segb = e.target.closest('[data-seg]');
  if (segb) {
    const id = segb.dataset.seg, v = segb.dataset.val;
    if (id === 'osize') onlineSize = +v;
    else if (id === 'lsize') localSetup.n = +v;
    else if (id.startsWith('lbot')) localSetup.seats[+id.slice(4)].bot = v === 'Computer';
    store.set('local', localSetup); render(); return;
  }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act !== 'remove') removeArmed = false;
  switch (act) {
    case 'home': goHome(); break;
    case 'local': startLocal(); break;
    case 'create': if (onlineReady) createTable(); break;
    case 'open': openTable(b.dataset.code); break;
    case 'join': joinByCode(b.dataset.code); break;
    case 'joincode': joinByCode(document.getElementById('joincode').value); break;
    case 'sit': if (await sit(G.code)) toast('You’re seated.'); break;
    case 'leave': await commit((d) => { if (d.status !== 'lobby') return null; d.seats = d.seats.filter((s) => s.bot || s.id !== myId); d.playerIds = d.playerIds.filter((x) => x !== myId); return d; }); goHome(); break;
    case 'addbot': commit((d) => { if (d.status !== 'lobby' || d.seats.length >= d.size) return null; d.seats.push({ id: null, nick: '', bot: true }); return d; }); break;
    case 'kick': { const i = +b.dataset.seat; commit((d) => { if (d.status !== 'lobby' || !d.seats[i]) return null; const s = d.seats.splice(i, 1)[0]; if (!s.bot) d.playerIds = d.playerIds.filter((x) => x !== s.id); return d; }); break; }
    case 'start': startOnline(); break;
    case 'remove':
      if (!removeArmed) { removeArmed = true; render(); break; }
      try { const code = G.code; goHome(); await db.doc('games/' + code).delete(); toast(`Table ${code} removed.`); } catch { toast('Couldn’t remove the table.'); }
      break;
    case 'copy': {
      const code = G.code;
      try { await navigator.clipboard.writeText(code); toast(`Copied ${code}`); } catch { toast(`Table code: ${code}`); }
      break;
    }
    case 'pick': {
      const src = b.dataset.src === 'c' ? 'c' : +b.dataset.src, color = +b.dataset.color;
      sel = sel && sel.src === src && sel.color === color ? null : { src, color };
      render(); break;
    }
    case 'cancel': sel = null; render(); break;
    case 'place': doMove(+b.dataset.line); break;
    case 'rematch':
      if (G.mode === 'local') { G.state = Engine.newGame(G.seats.length, Math.random, Math.floor(Math.random() * G.seats.length)); bannerFor = null; afterState(); render(); }
      else commit((d) => { if (d.status !== 'over' || d.hostId !== myId) return null; d.state = Engine.newGame(d.size, Math.random, Math.floor(Math.random() * d.size)); d.status = 'playing'; return d; });
      break;
  }
});
overlay.addEventListener('click', (e) => { if (e.target.closest('[data-act="closebanner"]')) { bannerFor = 'x'; renderOverlays(); } });
app.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'nick') { nick = t.value.trim(); store.set('nick', nick); }
  if (t.dataset.seat != null) { localSetup.seats[+t.dataset.seat].nick = t.value; store.set('local', localSetup); }
});
app.addEventListener('change', (e) => { if (e.target.id === 'opriv') onlinePrivate = e.target.checked; });
app.addEventListener('keydown', (e) => { if (e.target.id === 'joincode' && e.key === 'Enter') joinByCode(e.target.value); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sel) { sel = null; render(); } });

// keep a local game across page updates
window.claude?.hot?.snapshot?.(() => (G?.mode === 'local' ? { G } : {}));
const boot = (data) => { if (data?.G) { G = data.G; view = 'game'; afterState(); } render(); };
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});

// ---------- connect online (Firebase) ----------
(async () => {
  try {
    const cfg = window.TESSERA_FIREBASE;
    if (!window.firebase || !cfg || !cfg.apiKey || cfg.apiKey.startsWith('PASTE')) throw new Error('not configured');
    firebase.initializeApp(cfg);
    const auth = firebase.auth();
    const cred = auth.currentUser ? { user: auth.currentUser } : await auth.signInAnonymously();
    myId = cred.user.uid;
    const fs = firebase.firestore();
    try { fs.settings({ experimentalForceLongPolling: true, merge: true }); } catch (e) { console.warn(e); }
    const wrapDoc = (snap) => ({ exists: snap.exists, data: () => snap.data(), metadata: { fromCache: snap.metadata.fromCache } });
    db = {
      fs,
      doc(path) {
        const ref = fs.doc(path);
        return {
          get: async () => wrapDoc(await ref.get()),
          set: (d) => ref.set(d),
          delete: () => ref.delete(),
          onSnapshot: (next, err) => ref.onSnapshot((snap) => next(wrapDoc(snap)), err),
        };
      },
    };
    onlineReady = true;
    fs.collection('games').orderBy('updatedAt', 'desc').limit(60).onSnapshot((snap) => {
      lobby = snap.docs.map((d) => d.data());
      if (view === 'home') { const f = document.activeElement?.id; render(); if (f) document.getElementById(f)?.focus(); }
    }, (e) => { console.warn(e); toast(e && e.code === 'permission-denied' ? 'The database refused access. Check the Firestore rules (step 4).' : (e && e.code === 'failed-precondition' || /not.*exist|NOT_FOUND/i.test(e && e.message || '')) ? 'The Firestore database doesn’t exist yet (step 3).' : 'Database error: ' + ((e && e.code) || 'unknown')); });
  } catch (e) {
    onlineReady = false; console.warn('Online play unavailable:', e);
    const c = (e && e.code) || '';
    onlineError =
      !window.firebase ? 'The Firebase scripts didn’t load. Check your internet connection or turn off any blocker for this page.' :
      (e && e.message === 'not configured') ? 'Online play isn’t connected yet: config.js still has the placeholder values.' :
      c === 'auth/unauthorized-domain' ? 'This web address isn’t allowed yet. In Firebase: Authentication → Settings → Authorized domains → add ' + location.hostname :
      (c === 'auth/operation-not-allowed' || c === 'auth/admin-restricted-operation') ? 'Anonymous sign-in is turned off. In Firebase: Authentication → Sign-in method → Anonymous → Enable.' :
      (c === 'auth/api-key-not-valid.-please-pass-a-valid-api-key.' || c === 'auth/invalid-api-key') ? 'The apiKey in config.js isn’t valid. Copy it again from Firebase project settings.' :
      c === 'auth/requests-from-referer-are-blocked.' || /referer/i.test(e && e.message || '') ? 'The API key is restricted and doesn’t allow this address. Add ' + location.origin + '/* to its website restrictions.' :
      c === 'auth/network-request-failed' ? 'Couldn’t reach Firebase. Check your internet connection.' :
      'Online play couldn’t start (' + (c || (e && e.message) || 'unknown error') + ').';
  }
  onlineChecked = true;
  if (view === 'home') render();
})();
})();
</script>
</body>
</html>
